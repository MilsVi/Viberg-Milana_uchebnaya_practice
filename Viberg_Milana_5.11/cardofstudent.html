<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточка студента</title>
</head>
<body>

<div id="studentCard">
    <img src="../Учебная практика 5.11/Фото/Фото студента.jpg" alt="Фото студента">
    <h2 id="studentName">Иванов Иван Иванович</h2>
    <p>Специальность: <span id="specialty">Информатика</span></p>
    <p>Курс: <span id="course">2</span></p>

    <h3>Дисциплины:</h3>
    <ul id="disciplines">
        <li>Математика</li>
        <li>Программирование</li>
    </ul>

    <input type="text" id="newDiscipline" placeholder="Новая дисциплина">
    <button id="addBtn">Добавить дисциплину</button>
    <br><br>
    <button id="editBtn">Изменить информацию</button>
    <button id="hideBtn">Скрыть карточку</button>
</div>

<script src="cardofstudent.js"></script>
</body>
</html>
